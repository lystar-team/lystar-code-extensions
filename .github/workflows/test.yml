name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check version files
        run: node -e "const fs=require('node:fs'); if(require('./package.json').version!==fs.readFileSync('VERSION','utf8').trim()) process.exit(1)"
      - name: Run checks
        run: npm run check
      - name: Check package contents
        run: npm run pack:check
