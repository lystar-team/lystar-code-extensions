name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify version
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          test "$(node -p \"require('./package.json').version\")" = "$(cat VERSION)"
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build package archive
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
